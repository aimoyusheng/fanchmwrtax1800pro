name: Build FanchmWrt AX1800 Pro 固件
on:
  push:
    branches: [ "fanchmwrt-24.10.4" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4
        with:
          ref: fanchmwrt-24.10.4
          fetch-depth: 1

      - name: 2. 初始化系统环境
        run: |
          sudo timedatectl set-timezone Asia/Shanghai
          sudo swapoff -a
          sudo rm -rf /etc/apt/sources.list.d/*
          sudo apt-get update -o Acquire::Retries=3
          echo "环境初始化完成"

      - name: 3. 安装编译依赖
        run: |
          sudo apt-get install -y --fix-missing \
            build-essential ccache ecj fastjar file g++ gawk \
            gettext git java-propose-classpath libelf-dev libncurses5-dev \
            libncursesw5-dev libssl-dev python3 python3-distutils python3-setuptools \
            rsync subversion swig time unzip wget xsltproc zlib1g-dev
          echo "依赖安装完成"

      - name: 4. 更新&安装 feeds 源（3次重试）
        run: |
          for i in {1..3}; do
            ./scripts/feeds update -a && break
            sleep 5
          done
          ./scripts/feeds install -a
          echo "feeds更新安装完成"

      - name: 5. 执行自定义编译脚本
        run: |
          ls -la  # 这一步会列出根目录文件，确认ax1800pro是否存在
          chmod +x ax1800pro
          ./ax1800pro
          echo "自定义脚本执行完成"

      - name: 6. 校验编译配置
        run: |
          make defconfig
          echo "配置校验完成"

      - name: 7. 预下载编译源码包（3次重试）
        run: |
          for i in {1..3}; do
            make download -j8 && break
            sleep 5
          done
          echo "源码包下载完成"

      - name: 8. 编译固件（预计1-2小时）
        run: |
          make -j$(nproc) || make -j1 V=s
          echo "固件编译完成"

      - name: 9. 打包输出固件
        uses: actions/upload-artifact@v4
        with:
          name: FanchmWrt-AX1800-Pro-固件
          path: bin/targets/qualcommax/ipq60xx/
          retention-days: 30
